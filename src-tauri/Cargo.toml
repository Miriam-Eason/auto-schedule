[package]
name = "duty-roster"
version = "0.1.0"
description = "财会系值班排班系统"
authors = ["caihui"]
edition = "2021"

[lib]
name = "duty_roster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.27.0"

